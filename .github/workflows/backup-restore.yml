# Monthly (and manual) restore drill of the latest age+R2 backup.
# Off by default: exits 0 when the read-only R2 token or age identity is unset.
# Secrets live in the GitHub Environment `backup-drill` (restricted to main),
# never in repository secrets. Use a *read-only* R2 API token (not the VPS writer).
name: Backup restore drill

on:
  schedule:
    # 1st of each month at 14:00 UTC (10:00 ET / 09:00 ET during DST)
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backup-drill
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Restore latest offsite bundle into throwaway Postgres
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_REGION: ${{ secrets.BACKUP_R2_REGION }}
          BACKUP_R2_PREFIX: ${{ secrets.BACKUP_R2_PREFIX }}
          RESTORE_POSTGRES_IMAGE: postgres:16-alpine
          RESTORE_MIN_ORGS: "1"
          RESTORE_MIN_USERS: "1"
          RESTORE_MIN_VEHICLES: "100"
        run: |
          if [ -z "${BACKUP_AGE_IDENTITY}" ] || [ -z "${BACKUP_R2_ACCESS_KEY_ID}" ] || [ -z "${BACKUP_R2_SECRET_ACCESS_KEY}" ] || [ -z "${BACKUP_R2_ENDPOINT}" ] || [ -z "${BACKUP_R2_BUCKET}" ]; then
            echo "restore drill skipped: backup-drill environment secrets are not configured yet"
            exit 0
          fi
          bash deploy/scripts/restore-offsite.sh --latest
