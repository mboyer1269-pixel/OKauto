name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (topological)
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (unit + integration + e2e, embedded Postgres)
        run: pnpm -r test

      - name: Verify migrations are up to date
        run: |
          pnpm --filter @openlot/api db:generate
          git diff --exit-code apps/api/drizzle || (echo "::error::Drizzle migrations are stale — run pnpm db:generate" && exit 1)

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile .
