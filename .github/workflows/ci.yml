name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okauto
          POSTGRES_PASSWORD: okauto
          POSTGRES_DB: okauto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okauto -d okauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://okauto:okauto@localhost:5432/okauto?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-change-me-in-production-32
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me-in-production-32
      NEXT_PUBLIC_API_URL: http://localhost:4000
      AI_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @okauto/shared build
      - run: pnpm --filter @okauto/api prisma:generate
      - run: pnpm --filter @okauto/api prisma:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @okauto/api build
      - run: pnpm --filter @okauto/worker build
      - run: pnpm --filter @okauto/web build
      - run: pnpm --filter @okauto/extension build
