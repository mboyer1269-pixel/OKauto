name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okauto
          POSTGRES_PASSWORD: okauto
          POSTGRES_DB: okauto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://okauto:okauto@localhost:5432/okauto
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-change-me-32chars
      APP_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @okauto/db exec prisma migrate deploy
      - run: pnpm --filter @okauto/shared build
      - run: pnpm --filter @okauto/db build
      - run: pnpm --filter @okauto/shared test
      - run: pnpm --filter @okauto/web test
      - run: pnpm --filter @okauto/extension test
      - run: pnpm --filter @okauto/web typecheck
      - run: pnpm --filter @okauto/worker typecheck
      - run: pnpm --filter @okauto/extension typecheck
      - run: pnpm --filter @okauto/extension build
      - run: pnpm --filter @okauto/web build
      - run: pnpm --filter @okauto/worker build
