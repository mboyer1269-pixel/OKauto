name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okauto
          POSTGRES_PASSWORD: okauto
          POSTGRES_DB: okauto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://okauto:okauto@localhost:5432/okauto?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-minimum-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm --filter @okauto/database exec prisma db push

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @okauto/web build

      - name: Build extension
        run: pnpm --filter @okauto/extension build

      - name: Build worker
        run: pnpm --filter @okauto/worker build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okauto
          POSTGRES_PASSWORD: okauto
          POSTGRES_DB: okauto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://okauto:okauto@localhost:5432/okauto?schema=public
      JWT_SECRET: ci-test-secret-minimum-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup database
        run: |
          pnpm db:generate
          pnpm --filter @okauto/database exec prisma db push
          pnpm db:seed

      - name: Install Playwright
        run: pnpm --filter @okauto/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @okauto/web test:e2e
