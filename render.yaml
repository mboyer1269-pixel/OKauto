# Suivia Auto — Render Blueprint (OBSOLETE)
#
# Production is a Hostinger VPS with Docker Compose + Traefik (suivia.ca).
# This Render blueprint is not used for deploys. Kept only as historical
# reference. Set ALLOW_PUBLIC_SIGNUP=false and TRUST_PROXY=true in the VPS
# compose environment instead.
#
# https://render.com/docs/blueprint-spec

databases:
  - name: suivia-db
    plan: free
    databaseName: suivia
    user: suivia

services:
  - type: keyvalue
    name: suivia-cache
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: suivia-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    domains:
      - suivia.ca
      - www.suivia.ca
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suivia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: suivia-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: NEXT_PUBLIC_APP_URL
        value: https://suivia.ca
      - key: API_URL
        value: https://suivia.ca
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PUBLIC_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
