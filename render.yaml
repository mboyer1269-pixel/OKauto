# Suivia Auto — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render Dashboard → New → Blueprint
# Or: render blueprint sync

databases:
  - name: suivia-db
    plan: basic-256mb
    databaseName: suivia
    user: suivia

services:
  - type: keyvalue
    name: suivia-cache
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: suivia-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    domains:
      - suivia.ca
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suivia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: suivia-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://suivia.ca
      - key: API_URL
        value: https://suivia.ca
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PUBLIC_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: suivia-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suivia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: suivia-cache
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PUBLIC_URL
        sync: false
