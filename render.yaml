# OKauto Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render Dashboard → New → Blueprint
# Or: render blueprint sync

databases:
  - name: okauto-db
    plan: free
    databaseName: okauto
    user: okauto

services:
  - type: redis
    name: okauto-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: okauto-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: okauto-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: okauto-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PUBLIC_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: okauto-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: okauto-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: okauto-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PUBLIC_URL
        sync: false
