services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: driveflow
      POSTGRES_USER: driveflow
      POSTGRES_PASSWORD: driveflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driveflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  app:
    build: .
    environment: &app_environment
      DATABASE_URL: postgres://driveflow:driveflow@postgres:5432/driveflow
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      SESSION_PEPPER: local-only-session-pepper-change-me-123456
      IP_HASH_KEY: local-only-ip-hash-key-change-me-12345678
      EXTENSION_ORIGINS: ${EXTENSION_ORIGINS:-}
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm run start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3000:3000"

  worker:
    build: .
    environment: *app_environment
    command: ["npm", "run", "worker"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
