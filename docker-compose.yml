services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: okauto
      POSTGRES_PASSWORD: okauto
      POSTGRES_DB: okauto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okauto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: okauto-web:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql://okauto:okauto@postgres:5432/okauto?schema=public
      GIT_SHA: ${GIT_SHA:-dev}
    command: ["sh", "-c", "cd /app/packages/database && npx prisma migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: okauto-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    init: true
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://okauto:okauto@postgres:5432/okauto?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-32-chars-min}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL:-}
      GIT_SHA: ${GIT_SHA:-dev}
      RUN_MIGRATIONS_ON_BOOT: "false"
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: okauto-worker:local
    init: true
    environment:
      DATABASE_URL: postgresql://okauto:okauto@postgres:5432/okauto?schema=public
      REDIS_URL: redis://redis:6379
      GIT_SHA: ${GIT_SHA:-dev}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
