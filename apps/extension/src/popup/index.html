<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suivia</title>
    <style>
      :root {
        --bg: #0a0c10;
        --surface: #11141a;
        --elevated: #171b22;
        --border: #232833;
        --text: #e8ecf2;
        --muted: #8a93a3;
        --primary: #2556e0;
        --primary-fg: #ffffff;
        --signal: #2ee6a6;
        --amber: #1ad0ea;
        --graphite: #0b3a8a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 400px;
        font-family:
          ui-sans-serif,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .header {
        background: var(--graphite);
        color: var(--text);
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header svg {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
      }
      .header h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        font-family: ui-monospace, monospace;
      }
      .header .descriptor {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--amber);
        margin-top: 3px;
      }
      .header p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .content {
        padding: 16px;
      }
      .search {
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        font-size: 13px;
        margin-bottom: 10px;
        background: var(--surface);
        color: var(--text);
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--primary);
        color: var(--primary-fg);
        width: 100%;
      }
      .btn-primary:hover {
        filter: brightness(1.08);
      }
      .btn-assist {
        background: var(--primary);
        color: var(--primary-fg);
        padding: 7px 12px;
        font-size: 12px;
      }
      .vehicle-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .vehicle-card img {
        width: 68px;
        height: 51px;
        object-fit: cover;
        border-radius: 8px;
        background: var(--elevated);
        filter: brightness(0.92);
      }
      .vehicle-placeholder {
        width: 68px;
        height: 51px;
        flex: 0 0 auto;
        border-radius: 8px;
        background: var(--elevated);
      }
      .btn-assist:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }
      .vehicle-info {
        flex: 1;
        min-width: 0;
      }
      .vehicle-info h3 {
        font-size: 13px;
        font-weight: 600;
      }
      .vehicle-info p {
        font-size: 11px;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 600;
      }
      .badge-listed {
        background: color-mix(in srgb, var(--signal) 18%, transparent);
        color: var(--signal);
      }
      .status {
        text-align: center;
        padding: 20px;
        color: var(--muted);
        font-size: 13px;
      }
      .error {
        background: #3a1618;
        color: #ff5a5f;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        color: var(--amber);
        border-bottom-color: var(--amber);
      }
      .compliance {
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <!-- brand-mark -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="Suivia Auto">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0B3A8A"/>
            <stop offset="100%" stop-color="#1AD0EA"/>
          </linearGradient>
          <pattern id="h" width="3.2" height="40" patternUnits="userSpaceOnUse">
            <rect width="2.05" height="40" fill="#fff"/>
          </pattern>
          <mask id="m"><rect width="40" height="40" fill="url(#h)"/></mask>
          <clipPath id="c" clip-rule="evenodd">
          <path d="M 6.2 5.184 H 23.128 A 2.2 2.2 0 0 1 25.328 7.384 V 8.440000000000001 A 2.2 2.2 0 0 1 23.128 10.64 H 6.2 A 2.2 2.2 0 0 1 4 8.440000000000001 V 7.384 A 2.2 2.2 0 0 1 6.2 5.184 Z" />
          <path d="M 6.2 5.184 H 7.255999999999999 A 2.2 2.2 0 0 1 9.456 7.384 V 15.880000000000003 A 2.2 2.2 0 0 1 7.255999999999999 18.080000000000002 H 6.2 A 2.2 2.2 0 0 1 4 15.880000000000003 V 7.384 A 2.2 2.2 0 0 1 6.2 5.184 Z" />
          <path d="M 6.2 13.864 H 23.128 A 2.2 2.2 0 0 1 25.328 16.064 V 17.12 A 2.2 2.2 0 0 1 23.128 19.32 H 6.2 A 2.2 2.2 0 0 1 4 17.12 V 16.064 A 2.2 2.2 0 0 1 6.2 13.864 Z" />
          <path d="M 22.072 15.600000000000001 H 23.128 A 2.2 2.2 0 0 1 25.328 17.8 V 25.8 A 2.2 2.2 0 0 1 23.128 28 H 22.072 A 2.2 2.2 0 0 1 19.872 25.8 V 17.8 A 2.2 2.2 0 0 1 22.072 15.600000000000001 Z" />
          <path d="M 6.2 22.544 H 23.128 A 2.2 2.2 0 0 1 25.328 24.744 V 25.8 A 2.2 2.2 0 0 1 23.128 28 H 6.2 A 2.2 2.2 0 0 1 4 25.8 V 24.744 A 2.2 2.2 0 0 1 6.2 22.544 Z" />
          <path d="M 23.535999999999998 14.224 L 31.6 19.6 L 23.535999999999998 24.976000000000003 L 25.887999999999998 19.6 Z" />
          </clipPath>
        </defs>
        <rect width="40" height="40" rx="8.80" fill="#082A66"/>
        <g clip-path="url(#c)">
          <rect width="40" height="40" fill="url(#g)" mask="url(#m)"/>
        </g>
      </svg>
      <!-- /brand-mark -->
      <div>
        <h1>SUIVIA</h1>
        <div class="descriptor">Auto</div>
        <p id="org-name">Assistant de publication</p>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="inventory">Inventaire</div>
      <div class="tab" data-tab="settings">Réglages</div>
    </div>
    <div id="tab-inventory" class="content">
      <div id="error" class="error" style="display: none"></div>
      <label for="vehicle-search">Rechercher</label>
      <input
        class="search"
        type="search"
        id="vehicle-search"
        placeholder="Stock, NIV, marque ou modèle…"
      />
      <div id="vehicle-list"></div>
      <div id="loading" class="status">Chargement de l’inventaire…</div>
    </div>
    <div id="tab-settings" class="content" style="display: none">
      <label for="api-url">URL de l’application</label>
      <input type="url" id="api-url" placeholder="https://suivia.ca" />
      <label for="api-key">Clé API</label>
      <input type="password" id="api-key" placeholder="okauto_..." />
      <button class="btn-primary" id="save-settings">
        Enregistrer et connecter
      </button>
      <p class="compliance" style="margin-top: 12px">
        Assistance seulement. Vous devez vérifier et publier chaque annonce
        vous-même.
      </p>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
