<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suivia</title>
    <style>
      :root {
        --bg: #0a0c10;
        --surface: #11141a;
        --elevated: #171b22;
        --border: #232833;
        --text: #e8ecf2;
        --muted: #8a93a3;
        --primary: #2556e0;
        --primary-fg: #ffffff;
        --signal: #2ee6a6;
        --amber: #ffb020;
        --graphite: #111318;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 400px;
        font-family:
          ui-sans-serif,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .header {
        background: var(--graphite);
        color: var(--text);
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header svg {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
      }
      .header h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        font-family: ui-monospace, monospace;
      }
      .header .descriptor {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--amber);
        margin-top: 3px;
      }
      .header p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .content {
        padding: 16px;
      }
      .search {
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        font-size: 13px;
        margin-bottom: 10px;
        background: var(--surface);
        color: var(--text);
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--primary);
        color: var(--primary-fg);
        width: 100%;
      }
      .btn-primary:hover {
        filter: brightness(1.08);
      }
      .btn-assist {
        background: var(--primary);
        color: var(--primary-fg);
        padding: 7px 12px;
        font-size: 12px;
      }
      .vehicle-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .vehicle-card img {
        width: 68px;
        height: 51px;
        object-fit: cover;
        border-radius: 8px;
        background: var(--elevated);
        filter: brightness(0.92);
      }
      .vehicle-placeholder {
        width: 68px;
        height: 51px;
        flex: 0 0 auto;
        border-radius: 8px;
        background: var(--elevated);
      }
      .btn-assist:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }
      .vehicle-info {
        flex: 1;
        min-width: 0;
      }
      .vehicle-info h3 {
        font-size: 13px;
        font-weight: 600;
      }
      .vehicle-info p {
        font-size: 11px;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 600;
      }
      .badge-listed {
        background: color-mix(in srgb, var(--signal) 18%, transparent);
        color: var(--signal);
      }
      .status {
        text-align: center;
        padding: 20px;
        color: var(--muted);
        font-size: 13px;
      }
      .error {
        background: #3a1618;
        color: #ff5a5f;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        color: var(--amber);
        border-bottom-color: var(--amber);
      }
      .compliance {
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <!-- brand-mark -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect width="40" height="40" rx="8.80" fill="#111318"/>
        <rect x="7.000" y="2.06" width="2.453" height="9.88" rx="0.981" fill="#FFB020"/><rect x="10.925" y="3.282" width="2.453" height="10.92" rx="0.981" fill="#FFB020"/><rect x="14.849" y="7.659" width="2.453" height="11.681" rx="0.981" fill="#FFB020"/><rect x="18.774" y="14.02" width="2.453" height="11.96" rx="0.981" fill="#FFB020"/><rect x="22.698" y="20.659" width="2.453" height="11.681" rx="0.981" fill="#FFB020"/><rect x="26.623" y="25.798" width="2.453" height="10.92" rx="0.981" fill="#FFB020"/><rect x="30.547" y="28.06" width="2.453" height="9.88" rx="0.981" fill="#FFB020"/>
      </svg>
      <!-- /brand-mark -->
      <div>
        <h1>SUIVIA</h1>
        <div class="descriptor">Auto</div>
        <p id="org-name">Assistant de publication</p>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="inventory">Inventaire</div>
      <div class="tab" data-tab="settings">Réglages</div>
    </div>
    <div id="tab-inventory" class="content">
      <div id="error" class="error" style="display: none"></div>
      <label for="vehicle-search">Rechercher</label>
      <input
        class="search"
        type="search"
        id="vehicle-search"
        placeholder="Stock, NIV, marque ou modèle…"
      />
      <div id="vehicle-list"></div>
      <div id="loading" class="status">Chargement de l’inventaire…</div>
    </div>
    <div id="tab-settings" class="content" style="display: none">
      <label for="api-url">URL de l’application</label>
      <input type="url" id="api-url" placeholder="https://suivia.ca" />
      <label for="api-key">Clé API</label>
      <input type="password" id="api-key" placeholder="okauto_..." />
      <button class="btn-primary" id="save-settings">
        Enregistrer et connecter
      </button>
      <p class="compliance" style="margin-top: 12px">
        Assistance seulement. Vous devez vérifier et publier chaque annonce
        vous-même.
      </p>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
