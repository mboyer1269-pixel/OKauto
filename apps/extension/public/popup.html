<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenLot</title>
    <style>
      body { width: 300px; margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; }
      .wrap { padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
      .logo { display: inline-flex; width: 20px; height: 20px; border-radius: 6px; background: #4f46e5; color: #fff;
        align-items: center; justify-content: center; font-weight: 900; font-size: 12px; }
      label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin: 8px 0 3px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
      button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff;
        font-weight: 600; font-size: 13px; cursor: pointer; }
      button:hover { background: #4338ca; }
      button.secondary { background: #f1f5f9; color: #334155; }
      .error { color: #dc2626; font-size: 12px; margin-top: 8px; min-height: 14px; }
      .who { font-size: 12px; color: #475569; margin-bottom: 8px; }
      details { margin-top: 8px; }
      summary { font-size: 11px; color: #64748b; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap" id="root">Loading…</div>
    <script src="popup.js"></script>
  </body>
</html>
