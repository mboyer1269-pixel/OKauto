<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OKauto — Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options">
    <div class="opt-wrap">
      <div class="brand">OK<span>auto</span> settings</div>
      <p class="muted small">
        Pair this device with your OKauto account. Create a device token in the dashboard under
        Settings, then paste the API URL, organization ID, and token below.
      </p>
      <div id="status" class="status"></div>
      <label class="label" for="apiUrl">API URL</label>
      <input id="apiUrl" class="input" placeholder="http://localhost:3000" />
      <label class="label" for="orgId">Organization ID</label>
      <input id="orgId" class="input" placeholder="org id from dashboard settings" />
      <label class="label" for="token">Device token</label>
      <input id="token" class="input" type="password" placeholder="paste device token" />
      <div class="row" style="margin-top:12px">
        <button id="save" class="btn btn-primary">Test &amp; save</button>
        <button id="clear" class="btn">Disconnect</button>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
